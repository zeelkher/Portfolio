<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Zeel Kher</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<style>
/* ===== Global Styles ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Poppins, sans-serif;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-color: #222;
    color: #e5e5e5;
}
a { text-decoration: none; color: inherit; }

/* ===== Wrapper ===== */
.wrapper {
    width: 1280px;
    max-width: 95%;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

/* ===== Header ===== */
header {
    padding: 40px 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}
.logo-text {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
}
.navbar {
    display: flex;
    gap: 2rem;
}
.navbar a {
    color: #e5e5e5;
    font-size: 1rem;
    transition: color 0.3s ease;
}
.navbar a:hover { color: #007ced; }

/* ===== Contact Section ===== */
.contact {
    padding: 60px 0;
    text-align: center;
}
.contact h1 {
    font-size: 2.8rem;
    color: #007ced;
    margin-bottom: 10px;
}
.contact p {
    font-size: 1.1rem;
    margin-bottom: 30px;
    color: #aaa;
}

/* ===== Contact Details Cards ===== */
.contact-details {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
}
.contact-card {
    background: #2a2a2a;
    border: 1px solid #007ced;
    border-radius: 10px;
    padding: 20px 25px;
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 250px;
    transition: transform 0.3s, box-shadow 0.3s;
}
.contact-card i {
    font-size: 2rem;
    color: #007ced;
}
.contact-info {
    display: flex;
    flex-direction: column;
}
.contact-info a {
    color: #00d0ff;
    margin-top: 5px;
    transition: color 0.3s;
}
.contact-info a:hover { color: #007ced; }
.contact-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.5);
}

/* ===== Contact Form ===== */
.contact-form {
    max-width: 600px;
    margin: 0 auto;
    text-align: left;
    background: #2a2a2a;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 5px;
    border: 1px solid #007ced;
    background: #333;
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s;
}
.contact-form input:focus,
.contact-form textarea:focus { border-color: #00d0ff; }
.contact-form textarea { resize: vertical; min-height: 120px; }
.contact-form button {
    width: 100%;
    padding: 12px;
    border: 2px solid #007ced;
    border-radius: 5px;
    background: none;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.3s;
}
.contact-form button:hover { background: #007ced; }
.success-message {
    color: #00ff99;
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
}

/* ===== Footer ===== */
footer {
    text-align: center;
    background: #333;
    color: #fff;
    padding: 15px 0;
    margin-top: auto;
    width: 100%;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
    header { flex-direction: column; align-items: flex-start; }
    .navbar { margin-top: 10px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .contact-details { flex-direction: column; align-items: center; }
    .contact-card { width: 80%; }
    .contact-form { padding: 20px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <!-- Header -->
    <header>
        <div class="logo-text">Zeel Kher</div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="resume.html">Resume</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h1>Contact Me</h1>
        <p>You can reach me through the following details or send me a message directly:</p>

        <!-- Contact Details -->
        <div class="contact-details">
            <div class="contact-card">
                <i class="fas fa-envelope"></i>
                <div class="contact-info">
                    <strong>Email</strong>
                    <a href="mailto:zeelkher0407@gmail.com">zeelkher0407@gmail.com</a>
                </div>
            </div>

            <div class="contact-card">
                <i class="fab fa-skype"></i>
                <div class="contact-info">
                    <strong>Skype</strong>
                    <a href="https://join.skype.com/invite/yF7rXMpC9Jec">live:.cid.bb2420289226f0f0</a>
                </div>
            </div>

            <div class="contact-card">
                <i class="fab fa-instagram"></i>
                <div class="contact-info">
                    <strong>Instagram</strong>
                    <a href="https://www.instagram.com/zeelkher_45/">zeelkher_45</a>
                </div>
            </div>
        </div>

        <!-- Contact Form -->
        <form id="contactForm" class="contact-form">
            <input type="text" name="from_name" placeholder="Your Name" required>
            <input type="email" name="from_email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
            <div class="success-message" id="successMessage"></div>
        </form>
    </section>
</div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024-25 Zeel Kher. All Rights Reserved.</p>
    </footer>


<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){ emailjs.init("public_2ZOUBE6qmMtbEW7Tk"); })(); // Replace with your EmailJS user ID

// Form submission
document.getElementById('contactForm').addEventListener('submit', function(event){
    event.preventDefault();
    emailjs.sendForm('service_zwvvlul','template_cfamxk2', this)
    .then(function(){
        document.getElementById('successMessage').innerText = "Message sent successfully!";
        document.getElementById('contactForm').reset();
    }, function(error){
        alert("Oops! Something went wrong. Please try again.");
        console.log(error);
    });
});
</script>

</body>
</html>
