<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zeel Kher | Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<style>
* {
    box-sizing: border-box;
    padding: 0;
    margin: 0;
    font-family: Poppins, sans-serif;
    text-decoration: none;
}
html, body {
    height: 100%;
}
body {
    display: flex;
    flex-direction: column;
    background-color: #222;
    color: #e5e5e5;
}
.hero-header {
    display: flex;
    flex-direction: column;
    width: 100%;
    flex: 1;
}
.wrapper {
    flex: 1;
    width: 1280px;
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* Header with left/right spacing */
header {
    padding: 40px 50px 30px; /* Added 50px left/right space */
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}
.logo-text {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
}
.navbar {
    display: flex;
    gap: 2rem;
}
.navbar a {
    color: #e5e5e5;
    font-size: 1rem;
    transition: color 0.3s ease;
}
.navbar a:hover { color: #007ced; }

/* Container */
.container {
    flex: 1;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-top: 4rem;
    flex-wrap: wrap;
}
.hero-pic {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    border: 15px solid #444;
    box-shadow: 5px 7px 25px rgba(0,0,0,0.5);
}
.hero-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}
.hero-pic img:hover { transform: scale(1.2); }
.hero-text {
    max-width: 500px;
    display: flex;
    flex-direction: column;
}
.hero-text h5 { font-size: 14px; }
.hero-text h5 span { color: #007ced; font-size: 16px; }
.hero-text h1 { color: #007ced; font-size: 3rem; }
.hero-text p { margin-top: 10px; }
.btn-group { margin: 30px 0; }
.btn-group .btn {
    background: #333;
    color: #fff;
    padding: 12px 25px;
    border-radius: 30px;
    border: 2px solid #e5e5e5;
    margin-right: 10px;
    box-shadow: 0 10px 10px -8px rgba(0,0,0,0.78);
    transition: all 0.3s ease;
}
.btn-group .btn:hover {
    background-color: #007ced;
    border-color: #007ced;
}
.social i {
    font-size: 18px;
    margin-right: 10px;
    color: #e5e5e5;
    transition: 0.5s ease;
}
.social i:hover {
    color: #007ced;
    transform: rotate(360deg);
}

/* Footer sticky at bottom */
footer {
    text-align: center;
    background: #333;
    color: #fff;
    padding: 10px 0;
    margin-top: auto;
    width: 100%;
}

/* Responsive */
@media (max-width: 768px) {
    header { padding: 30px 20px; }
    .container { flex-direction: column; padding-top: 2rem; }
    .hero-text { padding: 40px 0; text-align: center; }
    .navbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px 0 0 0; }
}
@media (max-width: 460px) {
    .navbar a { font-size: 0.9rem; }
}
@media (max-width: 390px) {
    .navbar a { font-size: 0.75rem; margin: 8px; }
}
</style>
</head>
<body>

<div class="hero-header">
    <div class="wrapper">
        <header>
            <div class="logo">
                <div class="logo-text">Zeel Kher</div>
            </div>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="resume.html">Resume</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <section id="home">
            <div class="container">
                <div class="hero-pic">
                    <img src="images/zeelkher.jpeg" alt="profile pic">
                </div>
                <div class="hero-text">
                    <h5>Hi I'm <span class="input">Web Developer</span></h5>
                    <h1>Zeel Kher</h1>
                    <p>Passionate Web Developer skilled in frontend & backend...</p>
                    <div class="btn-group">
                        <a href="resume/zeelkher-Resume.pdf" class="btn active">Download CV</a>
                        <a href="https://www.instagram.com/zeelkher_45/" class="btn">Contact</a>
                    </div>
                    <div class="social">
                        <a href="https://www.facebook.com/share/18yhbEtU1y/?mibextid=qi2Omg"><i class="fa-brands fa-facebook"></i></a>
                            <a href="https://www.linkedin.com/in/zeel-kher-a248b9326"><i class="fa-brands fa-linkedin"></i></a>
                            <a href="https://www.instagram.com/zeelkher_45/"><i class="fa-brands fa-instagram"></i></a>
                            <a href="https://join.skype.com/invite/yF7rXMpC9Jec"><i class="fa-brands fa-skype"></i></a>
                            <a href="https://github.com/zeelkher"><i class="fa-brands fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2024-25 Zeel Kher. All Rights Reserved.</p>
        </footer>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.10/typed.min.js"></script>
<script>
var typed = new Typed(".input", {
    strings: ["Web Developer","Web Developer"],
    typeSpeed: 70,
    backSpeed: 55,
    loop: true
});
</script>
</body>
</html>
